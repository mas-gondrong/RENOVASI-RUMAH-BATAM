<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RENOVASI RUMAH</title>
  <meta name="description" content="Aplikasi website PWA jasa renovasi rumah dengan tampilan modern, responsif, dan dapat diinstal." />
  <meta name="theme-color" content="#8b5e3c" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    :root{
  --bg: #f5efe7;
  --bg-soft: #efe3d3;
  --surface: rgba(255,255,255,0.55);
  --surface-strong: rgba(255,255,255,0.82);
  --text: #2f241c;
  --muted: #6a5647;
  --accent: #8b5e3c;
  --accent-2: #c08a57;
  --line: rgba(67,45,29,0.12);
  --shadow: 0 20px 60px rgba(76, 49, 29, 0.14);
  --radius: 22px;
  --radius-lg: 34px;
  --max: 1180px;
}

*{
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html{
  scroll-behavior: smooth;
}

body{
  font-family: "DM Sans", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 10% 20%, rgba(192,138,87,0.18), transparent 28%),
    radial-gradient(circle at 85% 15%, rgba(139,94,60,0.12), transparent 24%),
    linear-gradient(180deg, #f8f3ed 0%, #f5efe7 100%);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before{
  content:"";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.05;
  background-image:
    linear-gradient(to right, rgba(47,36,28,0.15) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(47,36,28,0.15) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,0.35), transparent 75%);
}

img{
  max-width: 100%;
  display: block;
}

a{
  color: inherit;
  text-decoration: none;
}

button{
  font: inherit;
  border: none;
  background: none;
  cursor: pointer;
}

.container{
  width: min(var(--max), calc(100% - 28px));
  margin-inline: auto;
}

.site-shell{
  padding: 18px 0 60px;
}

.topbar{
  position: sticky;
  top: 12px;
  z-index: 30;
}

.header{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 12px 14px 12px 12px;
  background: var(--surface);
  border: 1px solid rgba(255,255,255,0.45);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius: 999px;
  box-shadow: var(--shadow);
  z-index: 40; /* pastikan header di atas elemen lain */
}

.brand{
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.logo {
  width: 92px;
  height: 92px;
  border-radius: 90%;
  object-fit: cover;
  cursor: pointer;
  border: 2px solid rgba(255,255,255,0.5);
  box-shadow:
    inset 0 2px 10px rgba(255,255,255,0.25),
    0 10px 25px rgba(121,78,44,0.28);
}

.logo::before{
  content: "";
  position: absolute;
  inset: 9px;
  border-radius: 50%;
  background:
    linear-gradient(145deg, rgba(255,255,255,0.95), rgba(255,255,255,0.2));
  clip-path: polygon(50% 8%, 82% 34%, 82% 77%, 18% 77%, 18% 34%);
  opacity: 0.9;
}

.logo::after{
  content: "";
  position: absolute;
  left: 50%;
  bottom: 10px;
  transform: translateX(-50%);
  width: 18px;
  height: 16px;
  border-radius: 0 0 4px 4px;
  background: rgba(127,85,54,0.9);
  box-shadow: 0 -1px 0 rgba(255,255,255,0.35) inset;
    }
    .brand-copy{
  min-width: 0;
}

.eyebrow{
  display: block;
  font-size: 0.73rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 2px;
}

.brand-title{
  font-family: "Cormorant Garamond", serif;
  font-size: 1.35rem;
  line-height: 1;
  letter-spacing: 0.02em;
  white-space: nowrap; /* agar judul header tidak pecah baris */
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: calc(100vw - 140px); /* beri ruang agar tidak menempel tombol toggle */
}

.menu-toggle{
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,255,255,0.55));
  border: 1px solid rgba(67,45,29,0.1);
  display: grid;
  place-items: center;
  transition: transform .28s ease, box-shadow .28s ease, background .28s ease;
  box-shadow: 0 10px 24px rgba(87,57,34,0.12);
  flex: 0 0 auto;
  z-index: 50; /* pastikan tombol toggle di atas */
}

.menu-toggle:hover{
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 16px 30px rgba(87,57,34,0.18);
  background: linear-gradient(180deg, rgba(255,255,255,1), rgba(250,240,232,0.88));
}

.hamburger{
  width: 20px;
  height: 14px;
  position: relative;
}

.hamburger span{
  position: absolute;
  left: 0;
  width: 100%;
  height: 2px;
  border-radius: 999px;
  background: var(--text);
  transition: transform .28s ease, opacity .2s ease, top .28s ease;
}

.hamburger span:nth-child(1){ top: 0; }
.hamburger span:nth-child(2){ top: 6px; }
.hamburger span:nth-child(3){ top: 12px; }

.menu-toggle.active .hamburger span:nth-child(1){
  top: 6px;
  transform: rotate(45deg);
}

.menu-toggle.active .hamburger span:nth-child(2){
  opacity: 0;
}

.menu-toggle.active .hamburger span:nth-child(3){
  top: 6px;
  transform: rotate(-45deg);
}

.nav-drawer{
  margin-top: 12px;
  background: var(--surface-strong);
  border: 1px solid rgba(255,255,255,0.55);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: var(--shadow);
  border-radius: 24px;
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  transform: translateY(-10px);
  transition: max-height .45s ease, opacity .28s ease, transform .28s ease;
}

.nav-drawer.open{
  max-height: 360px;
  opacity: 1;
  transform: translateY(0);
}

.nav-drawer nav{
  display: grid;
  padding: 10px;
}

.nav-drawer a{
  padding: 15px 16px;
  border-radius: 16px;
  color: var(--text);
  font-weight: 500;
  transition: background .25s ease, transform .25s ease, color .25s ease;
}

.nav-drawer a:hover{
  background: rgba(139,94,60,0.09);
  color: var(--accent);
  transform: translateX(4px);
}

main{
  margin-top: 22px;
}

.hero{
  display: grid;
  gap: 18px;
}

.banner {
  background-image: url('banner.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  /* Bisa juga menambahkan overlay warna transparan agar teks tetap terbaca */
  position: relative;
  color: #f5efe7; /* sesuaikan warna teks agar kontras */
}

.banner::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, 0.15); /* overlay cahaya lembut */
  pointer-events: none;
  z-index: 1;
}

.banner > * {
  position: relative;
  z-index: 2; /* agar konten di atas overlay */
}
    
.hero h1 {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(1.2rem, 4vw, 2rem);
  line-height: 1.1;
  margin: 0;
  white-space: nowrap; /* agar teks tetap satu baris */
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

.hero p.lead {
  margin-top: 12px;
  font-size: 1rem;
  line-height: 1.5;
  white-space: normal; /* agar paragraf membungkus dengan rapi */
  max-width: 100%;
}

.content-panel{
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  gap: 18px;
}

.description-block,
.highlight-block{
  position: relative;
  background: var(--surface);
  border: 1px solid rgba(255,255,255,0.55);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 28px;
  box-shadow: var(--shadow);
  overflow: hidden;
  padding: 28px 32px;
}

.description-block::before{
  content:"";
  position:absolute;
  right:-40px;
  top:-40px;
  width:180px;
  height:180px;
  border-radius:50%;
  background: radial-gradient(circle, rgba(192,138,87,0.24), transparent 68%);
  pointer-events:none;
}

.section-label{
  color: var(--accent);
  letter-spacing: .18em;
  text-transform: uppercase;
  font-size: .78rem;
  font-weight: 700;
  margin-bottom: 10px;
  display: inline-block;
}

.description-block h2 {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(1.5rem, 3vw, 2.4rem);
  line-height: 1.1;
  margin: 0 0 16px 0;
  white-space: nowrap; /* agar judul tetap satu baris */
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
  color: var(--text);
}

.description-block p {
  font-size: 1rem;
  line-height: 1.6;
  color: var(--muted);
  white-space: normal;
}

.highlight-block{
  padding: 22px;
  display: grid;
  align-content: space-between;
  min-height: 100%;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.78), rgba(255,248,241,0.62));
}

.mini-stat{
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}

.mini-stat:last-child{
  border-bottom: none;
}

.mini-stat strong{
  display:block;
  font-size: clamp(1.6rem, 4vw, 2.4rem);
  color: var(--accent);
  line-height: 1;
  margin-bottom: 6px;
  white-space: nowrap; /* agar teks tetap satu baris */
  overflow: hidden;
  text-overflow: ellipsis;
}

.mini-stat span{
  color: var(--muted);
  line-height: 1.6;
  font-size: .96rem;
  white-space: normal;
}

.actions{
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 22px;
}

.btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 50px;
  padding: 0 20px;
  border-radius: 999px;
  font-weight: 700;
  transition: transform .26s ease, box-shadow .26s ease, background .26s ease, color .26s ease;
}

.btn-primary{
  color: #fffaf6;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 16px 26px rgba(139,94,60,0.28);
}

.btn-primary:hover{
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 22px 34px rgba(139,94,60,0.34);
}

.btn-secondary{
  color: var(--text);
  border: 1px solid rgba(67,45,29,0.12);
  background: rgba(255,255,255,0.58);
}

.btn-secondary:hover{
  transform: translateY(-2px);
  background: rgba(255,255,255,0.88);
  color: var(--accent);
}

.services{
  margin-top: 18px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.service-item{
  padding: 22px 18px;
  border-radius: 24px;
  background: rgba(255,255,255,0.5);
  border: 1px solid rgba(255,255,255,0.52);
  box-shadow: 0 14px 30px rgba(86,55,35,0.08);
  transition: transform .28s ease, box-shadow .28s ease, border-color .28s ease;
}

.service-item:hover{
  transform: translateY(-5px);
  box-shadow: 0 22px 40px rgba(86,55,35,0.14);
  border-color: rgba(192,138,87,0.34);
}

.service-no{
  font-family: "Cormorant Garamond", serif;
  font-size: 2rem;
  color: rgba(139,94,60,0.42);
  line-height: 1;
  margin-bottom: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.service-item h3{
  font-size: 1.06rem;
  margin-bottom: 8px;
}

.service-item p{
  color: var(--muted);
  line-height: 1.7;
  font-size: .96rem;
  }

  footer{
  margin-top: 36px;
  padding: 22px 0 8px;
  color: var(--muted);
  font-size: .95rem;
}

.footer-box{
  border-top: 1px solid var(--line);
  padding-top: 18px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.reveal{
  opacity: 0;
  transform: translateY(20px);
  transition: opacity .7s ease, transform .7s ease;
}

.reveal.visible{
  opacity: 1;
  transform: translateY(0);
}

.stagger-1{ animation: intro .8s ease .05s both; }
.stagger-2{ animation: intro .8s ease .18s both; }
.stagger-3{ animation: intro .8s ease .31s both; }
.stagger-4{ animation: intro .8s ease .44s both; }

@keyframes intro{
  from{
    opacity: 0;
    transform: translateY(22px);
  }
  to{
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 920px){
  .content-panel{
    grid-template-columns: 1fr;
  }

  .services{
    grid-template-columns: 1fr;
  }

  .hero h1{
    max-width: 10ch;
  }
}

@media (max-width: 640px){
  .site-shell{
    padding-top: 14px;
  }

  .header{
    padding: 10px 10px 10px 10px;
  }

  .brand-title{
    font-size: 1.15rem;
  }

  .logo,
  .menu-toggle{
    width: 48px;
    height: 48px;
  }

  .hero-content{
    padding: 20px;
  }

  .description-block,
  .highlight-block{
    border-radius: 24px;
  }

  .banner{
    border-radius: 28px;
  }
    }
  </style>
</head>
<body>
  <div class="site-shell">
    <div class="container">
      <div class="topbar">
        <header class="header stagger-1" aria-label="Header utama">
          <a href="#" class="brand" aria-label="RENOVASI RUMAH" id="adminLogo">
  <img src="logo.png" alt="Logo Renovasi Rumah" class="logo" />
  <div class="brand-copy">
    <span class="eyebrow">JASA</span>
    <div class="brand-title">RENOVASI RUMAH BATAM</div>
  </div>
  </a>

          <button class="menu-toggle" id="menuToggle" aria-label="Buka menu navigasi" aria-expanded="false" aria-controls="navDrawer">
            <div class="hamburger" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </button>
        </header>

        <div class="nav-drawer" id="navDrawer">
          <nav aria-label="Navigasi utama">
            <a href="#beranda">Beranda</a>
            <a href="#deskripsi">Deskripsi</a>
            <a href="#layanan">Layanan</a>
            <a href="#kontak">Kontak</a>
          </nav>
        </div>
      </div>

      <main id="beranda">
        <section class="hero">
          <div class="banner stagger-2 reveal">
            <svg class="house-illustration" viewBox="0 0 1200 700" preserveAspectRatio="none" aria-hidden="true">
              <defs>
                <linearGradient id="roofShade" x1="0" x2="1">
                  <stop offset="0%" stop-color="#4a2d1c"/>
                  <stop offset="100%" stop-color="#7b4f31"/>
                </linearGradient>
                <linearGradient id="wallShade" x1="0" x2="1">
                  <stop offset="0%" stop-color="#f2dcc5"/>
                  <stop offset="100%" stop-color="#dfb78f"/>
                </linearGradient>
                <linearGradient id="glassShade" x1="0" x2="1">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
                  <stop offset="100%" stop-color="#d6b89d" stop-opacity="0.45"/>
                </linearGradient>
              </defs>

              <rect x="0" y="520" width="1200" height="180" fill="rgba(34,23,17,0.30)"/>
              <rect x="110" y="300" width="360" height="230" rx="8" fill="url(#wallShade)"/>
              <polygon points="85,315 290,170 500,315" fill="url(#roofShade)"/>
              <rect x="520" y="255" width="520" height="275" rx="8" fill="#e5c09a"/>
              <polygon points="470,275 785,120 1090,275" fill="url(#roofShade)"/>

              <rect x="170" y="360" width="80" height="90" rx="4" fill="url(#glassShade)"/>
              <rect x="280" y="360" width="80" height="90" rx="4" fill="url(#glassShade)"/>
              <rect x="610" y="320" width="110" height="110" rx="4" fill="url(#glassShade)"/>
              <rect x="760" y="320" width="110" height="110" rx="4" fill="url(#glassShade)"/>
              <rect x="910" y="320" width="70" height="210" rx="4" fill="#7f5536"/>

              <rect x="310" y="430" width="90" height="100" rx="4" fill="#7f5536"/>
              <rect x="560" y="470" width="290" height="18" rx="9" fill="rgba(255,255,255,0.18)"/>
              <circle cx="1010" cy="170" r="44" fill="rgba(255,244,228,0.36)"/>
            </svg>

            <div class="hero-content">
              <span class="hero-tag">Solusi hunian nyaman & modern</span>
              <h1>JASA RENOVASI RUMAH BATAM</h1>
              <p class="lead">
                Wujudkan rumah impian dengan pengerjaan rapi, desain fungsional, dan hasil yang lebih kuat, indah, serta bernilai.
              </p>
            </div>
          </div>

      <footer id="kontak">
        <div class="footer-box">
          <p>© 2026 RENOVASI RUMAH BATAM</p>
          <p>Siap membantu pembaruan hunian Anda</p>
        </div>
      </footer>
    </div>
  </div>

  <script>
    const menuToggle = document.getElementById('menuToggle');
    const navDrawer = document.getElementById('navDrawer');

    menuToggle.addEventListener('click', () => {
      const isOpen = navDrawer.classList.toggle('open');
      menuToggle.classList.toggle('active', isOpen);
      menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });

    document.querySelectorAll('.nav-drawer a').forEach(link => {
      link.addEventListener('click', () => {
        navDrawer.classList.remove('open');
        menuToggle.classList.remove('active');
        menuToggle.setAttribute('aria-expanded', 'false');
      });
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.14 });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const swCode = `
            const CACHE_NAME = 'renovasi-rumah-pwa-v1';
            const urlsToCache = [
              './',
            ];

            self.addEventListener('install', event => {
              event.waitUntil(
                caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache))
              );
              self.skipWaiting();
            });

            self.addEventListener('activate', event => {
              event.waitUntil(
                caches.keys().then(keys =>
                  Promise.all(
                    keys.map(key => {
                      if (key !== CACHE_NAME) return caches.delete(key);
                    })
                  )
                )
              );
              self.clients.claim();
            });

            self.addEventListener('fetch', event => {
              event.respondWith(
                caches.match(event.request).then(response => {
                  return response || fetch(event.request).catch(() => caches.match('./'));
                })
              );
            });
          `;

          const manifestData = {
            name: "RENOVASI RUMAH",
            short_name: "Renovasi",
            start_url: "./",
            display: "standalone",
            background_color: "#f5efe7",
            theme_color: "#8b5e3c",
            description: "Aplikasi PWA jasa renovasi rumah yang modern dan responsif.",
            icons: [
              {
                src: "data:image/svg+xml;base64," + btoa(`
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
                    <defs>
                      <linearGradient id="g" x1="0" x2="1">
                        <stop offset="0%" stop-color="#c08a57"/>
                        <stop offset="100%" stop-color="#7f5536"/>
                      </linearGradient>
                    </defs>
                    <rect width="192" height="192" rx="44" fill="#f5efe7"/>
                    <circle cx="96" cy="96" r="70" fill="url(#g)"/>
                    <path d="M96 44 L138 77 V134 H54 V77 Z" fill="rgba(255,255,255,0.92)"/>
                    <rect x="87" y="104" width="18" height="30" rx="3" fill="#7f5536"/>
                  </svg>
                `),
                sizes: "192x192",
                type: "image/svg+xml",
                purpose: "any maskable"
              },
              {
                src: "data:image/svg+xml;base64," + btoa(`
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                    <defs>
                      <linearGradient id="g" x1="0" x2="1">
                        <stop offset="0%" stop-color="#c08a57"/>
                        <stop offset="100%" stop-color="#7f5536"/>
                      </linearGradient>
                    </defs>
                    <rect width="512" height="512" rx="120" fill="#f5efe7"/>
                    <circle cx="256" cy="256" r="186" fill="url(#g)"/>
                    <path d="M256 126 L366 212 V362 H146 V212 Z" fill="rgba(255,255,255,0.95)"/>
                    <rect x="234" y="275" width="44" height="87" rx="6" fill="#7f5536"/>
                  </svg>
                `),
                sizes: "512x512",
                type: "image/svg+xml",
                purpose: "any maskable"
              }
            ]
          };

          const swBlob = new Blob([swCode], { type: 'text/javascript' });
          const swUrl = URL.createObjectURL(swBlob);
          navigator.serviceWorker.register(swUrl);

          const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/manifest+json' });
          const manifestUrl = URL.createObjectURL(manifestBlob);
          document.querySelector('link[rel="manifest"]').setAttribute('href', manifestUrl);
        } catch (error) {
          console.log('PWA init gagal:', error);
        }
      });
    }

const adminLogo = document.getElementById('adminLogo');
let clickCount = 0;
let clickTimer = null;

adminLogo.addEventListener('click', (e) => {
  e.preventDefault();
  clickCount++;

  if (clickCount === 5) {
    clickCount = 0;
    openAdminLogin();
  }

  clearTimeout(clickTimer);
  clickTimer = setTimeout(() => {
    clickCount = 0;
  }, 2000); // reset hitungan jika jeda klik lebih dari 2 detik
});

function openAdminLogin() {
  // Tampilkan halaman login admin (bisa modal atau redirect)

  if (password === 'admin123') { // ganti dengan sistem autentikasi yang lebih aman
    showAdminPanel();
  } else {
    alert('Password salah!');
  }
}
